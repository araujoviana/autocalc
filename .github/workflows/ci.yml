name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: bun --bun x playwright install --with-deps chromium

      - name: Install Chromium for Playwright (Windows)
        if: matrix.os == 'windows-latest'
        run: bun --bun x playwright install chromium

      - name: Cache catalog
        uses: actions/cache@v4
        with:
          path: ~/.cache/autocalc
          key: ${{ runner.os }}-autocalc-catalog-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-autocalc-catalog-

      - name: Typecheck and boundary check
        run: |
          bun run check
          bun run check:boundaries

      - name: Offline tests
        run: bun run test:offline

      - uses: astral-sh/setup-uv@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          enable-cache: true

      - name: Docs (Strict build & drift check)
        if: matrix.os == 'ubuntu-latest'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          bun run docs:build
          git diff --exit-code docs/reference/services/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OpenSpec validation
        run: |
          npm install -g @fission-ai/openspec@1.14.1
          openspec validate --all --strict
