name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install (locked, dev + docs groups)
        run: uv sync --locked --group dev --group docs

      - name: Lint
        run: uv run ruff check

      - name: Offline tests
        run: uv run pytest -m "not live"

      - name: Docs
        run: uv run --group docs mkdocs build --strict
