name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install (locked, dev + docs groups)
        run: uv sync --locked --group dev --group docs

      - name: Lint
        run: uv run ruff check

      - name: Offline tests
        run: uv run pytest -m "not live"

      - name: Docs
        run: uv run --group docs mkdocs build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OpenSpec validation
        run: |
          npm install -g @fission-ai/openspec@1.14.1
          openspec validate --all --strict
