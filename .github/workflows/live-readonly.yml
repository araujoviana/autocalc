name: Anonymous calculator drift
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  anonymous-page-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun --bun x playwright install --with-deps chromium
      - name: Anonymous page and rating comparison (no saved lists or session)
        run: bun run test:live
