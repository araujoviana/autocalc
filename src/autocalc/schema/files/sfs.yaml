service: sfs
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_sfsType_radio_fileType
  kind: base-radio-group
  title: File System Type
  value_type: Filter
  option_key: fileType
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_sfsType_radio_sfsType
  kind: base-radio-group
  title: Type
  value_type: Filter
  option_key: sfsType
  values: catalog
  after:
  - calculator_sfsType_radio_fileType
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_sfsType_radio_storageSizeSpec
  kind: base-radio-group
  title: Storage Space
  value_type: Filter
  option_key: storageSizeSpec
  values: catalog
  after:
  - calculator_sfsType_radio_sfsType
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_sfsType_radio_storageSizeSpec
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 10000.0
    default: 1.0
    unit: PCS
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
- id: calculator_sfsDemand_radio_Stepper_0
  kind: base-stepper
  option: capacity_gb
  note: shown only in the on-demand form; added by hand
  modes:
  - ondemand
