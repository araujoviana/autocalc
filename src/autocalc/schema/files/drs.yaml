service: drs
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_drsvm_radio_drsType
  kind: base-radio-group
  title: Task Type
  value_type: Filter
  option_key: drsType
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  option: type
- id: calculator_drsvm_radio_flowInout
  kind: base-radio-group
  title: Data Flow
  value_type: Filter
  option_key: flowInout
  values: catalog
  after:
  - calculator_drsvm_radio_drsType
  option: flow
- id: calculator_drsvm_radio_specificationType
  kind: base-radio-group
  title: Specifications
  value_type: Filter
  option_key: specificationType
  values: catalog
  after:
  - calculator_drsvm_radio_flowInout
  option: specification
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_drsvm_radio_specificationType
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 4000.0
    default: 1.0
    unit: PCS
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
