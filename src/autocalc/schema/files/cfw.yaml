service: cfw
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_cfw_editionRadio_edition
  kind: base-radio-group
  title: Edition
  value_type: Filter
  option_key: edition
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_cfw_eipStepper_Stepper_0
  kind: base-stepper
  title: Add EIP Protection Capacity
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 0.0
    max: 2000.0
    default: 0.0
    unit: PCS
  after:
  - calculator_cfw_editionRadio_edition
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_cfw_bandwidthStepper_Stepper_0
  kind: base-stepper
  title: Add Internet Border Protection Bandwidth
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 0.0
    max: 20000.0
    step: 5.0
    default: 5.0
    unit: Mbit/s
  after:
  - calculator_cfw_eipStepper_Stepper_0
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_cfw_bandwidthStepper_Stepper_0
  option: periods
