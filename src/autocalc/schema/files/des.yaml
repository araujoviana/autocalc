service: des
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_product_select_transferTypeClass
  kind: base-radio-group
  title: Transmission Mode
  value_type: Filter
  option_key: transferTypeClass
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  option: transfer_type
- id: calculator_product_select_teleportSpec
  kind: base-radio-group
  title: Teleport Specification
  value_type: Filter
  option_key: teleportSpec
  values: catalog
  after:
  - calculator_product_select_transferTypeClass
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_product_stepper_Stepper_0
  kind: base-stepper
  title: Teleport Onsite Duration
  value_type: Stepper_Usage
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 99.0
    default: 1.0
    unit: day
  after:
  - calculator_product_select_teleportSpec
  option: devices
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Required Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 99.0
    default: 1.0
    unit: amount
  after:
  - calculator_product_stepper_Stepper_0
  option: quantity
