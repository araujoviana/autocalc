service: dsc
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_dsc_radio_group_version
  kind: base-radio-group
  title: Basic Package Specifications
  value_type: Filter
  option_key: version
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_Traffic_db_stepper_Stepper_0
  kind: base-stepper
  title: Database Expansion Package
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 0.0
    max: 10000.0
    default: 0.0
    unit: PCS
  after:
  - calculator_dsc_radio_group_version
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_Traffic_obs_stepper_Stepper_0
  kind: base-stepper
  title: OBS Expansion Package
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 0.0
    max: 10000.0
    default: 0.0
    unit: PCS
  after:
  - calculator_Traffic_db_stepper_Stepper_0
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_Traffic_obs_stepper_Stepper_0
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - max: 1.0
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
