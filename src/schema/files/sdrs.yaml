service: sdrs
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_sdrs_stepper_replicationType
  kind: base-select
  title: DR Server
  value_type: Filter
  option_key: replicationType
  default: detail_32_
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_sdrs_stepper_Stepper_0
  kind: base-stepper
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 1000.0
    default: 1.0
  after:
  - calculator_sdrs_stepper_replicationType
  option: protection_groups
- id: global_ONDEMANDTIME_Stepper_0
  kind: base-stepper
  title: Required Duration
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 9999.0
    default: 1.0
    unit: hour
  after:
  - calculator_sdrs_stepper_Stepper_0
  option: hours
