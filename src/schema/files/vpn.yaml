service: vpn
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_gatewayType_radio_gatewayType
  kind: base-radio-group
  title: VPN Edition
  value_type: Filter
  option_key: gatewayType
  default: dataInfo_16_
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_gatewayMode_radio_gatewayMode
  kind: base-radio-group
  title: Mode
  value_type: Filter
  option_key: gatewayMode
  default: dataInfo_20_
  values: catalog
  after:
  - calculator_gatewayType_radio_gatewayType
  option: mode
- id: calculator_evpnNetworkType_switch_UNSET_Switch
  kind: base-radio-group
  title: Network Type
  value_type: Filter
  option_key: UNSET_Switch
  values: catalog
  after:
  - calculator_gatewayMode_radio_gatewayMode
