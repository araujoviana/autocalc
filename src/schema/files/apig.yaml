service: apig
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_spec_radioGroups_type
  kind: base-radio-group
  title: Edition
  value_type: Filter
  option_key: type
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  option: edition
- id: calculator_bandwidth_switch_UNSET_Switch
  kind: base-radio-group
  title: Public Outbound Access
  value_type: Filter
  option_key: UNSET_Switch
  values: catalog
  after:
  - calculator_spec_radioGroups_type
  unsupported: true
  note: fixed to no public outbound bandwidth by the builder
- id: calculator_bandwidth_stepper_Stepper_0
  kind: base-stepper
  title: Bandwidth
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 2000.0
    default: 5.0
    unit: Mbit/s
  after:
  - calculator_bandwidth_switch_UNSET_Switch
  unsupported: true
  note: outbound bandwidth add-on is not configured by the builder
- id: global_ONDEMANDTIME_Stepper_0
  kind: base-stepper
  title: Required Duration
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 9999.0
    default: 1.0
    unit: hour
  after:
  - calculator_bandwidth_stepper_Stepper_0
  option: hours
