service: kafka
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_kafka_architecture_switch_architectureName
  kind: base-radio-group
  title: Architecture
  value_type: Filter
  option_key: architectureName
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  option: spec_id
- id: calculator_kafka_specType_switch_specName
  kind: base-radio-group
  title: Flavor
  value_type: Filter
  option_key: specName
  values: catalog
  after:
  - calculator_kafka_architecture_switch_architectureName
  option: spec_id
- id: calculator_kafka_node_num_stepper_Stepper_0
  kind: base-stepper
  title: Brokers
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 1.0
    default: 1.0
    unit: PCS
  after:
  - calculator_kafka_specType_switch_specName
  option: brokers
- id: calculator_kafka_new_storage_stepper_storageType
  kind: base-select
  title: Storage Space per Broker
  value_type: Filter
  option_key: storageType
  default: dataInfo_7_
  values: catalog
  after:
  - calculator_kafka_node_num_stepper_Stepper_0
  option: storage_type
- id: calculator_kafka_new_storage_stepper_Stepper_0
  kind: base-stepper
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 100.0
    max: 10000.0
    step: 100.0
    default: 100.0
  after:
  - calculator_kafka_new_storage_stepper_storageType
  option: storage_gb
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_kafka_new_storage_stepper_Stepper_0
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 999.0
    default: 1.0
    unit: instance
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
