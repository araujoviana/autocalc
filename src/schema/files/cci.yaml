service: cci
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_cciSpec_radio_arch
  kind: base-radio-group
  title: CPU Architecture
  value_type: Filter
  option_key: arch
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: builder prices on-demand container CPU and memory
- id: calculator_cciSpec_radio_productType
  kind: base-radio-group
  title: Type
  value_type: Filter
  option_key: productType
  values: catalog
  after:
  - calculator_cciSpec_radio_arch
  unsupported: true
  note: builder prices on-demand container CPU and memory
- id: calculator_cciSpec_radio_specType
  kind: base-radio-group
  title: Package
  value_type: Filter
  option_key: specType
  values: catalog
  after:
  - calculator_cciSpec_radio_productType
  unsupported: true
  note: resource packages are not used by the on-demand builder
- id: calculator_cciSpec_radio_gpu
  kind: base-radio-group
  value_type: Filter
  option_key: gpu
  values: catalog
  after:
  - calculator_cciSpec_radio_specType
  unsupported: true
  note: GPU pods are not used by the CPU/memory builder
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_cciSpec_radio_gpu
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 999.0
    default: 1.0
    unit: PCS
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
