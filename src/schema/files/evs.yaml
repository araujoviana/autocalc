service: evs
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_product_stepper_productType
  kind: base-select
  title: Disk Capacity
  value_type: Filter
  option_key: productType
  default: calc_7_
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  option: type
- id: calculator_product_stepper_Stepper_0
  kind: base-stepper
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 10.0
    max: 32768.0
    step: 10.0
    default: 10.0
    unit: detail_42_
  after:
  - calculator_product_stepper_productType
  option: size_gb
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_product_stepper_Stepper_0
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 10000.0
    default: 1.0
    unit: disk
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
