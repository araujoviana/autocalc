service: dew
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_hsmType_radio_hsmName
  kind: base-radio-group
  title: Service Type
  value_type: Filter
  option_key: hsmName
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: builder prices KMS and CSMS on-demand usage
- id: calculator_hsmType_radio_hsmType
  kind: base-radio-group
  title: Edition
  value_type: Filter
  option_key: hsmType
  values: catalog
  after:
  - calculator_hsmType_radio_hsmName
  unsupported: true
  note: builder prices KMS and CSMS on-demand usage
- id: calculator_hsmType_radio_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 2.0
    max: 99.0
    default: 2.0
    unit: detail_118_
  after:
  - calculator_hsmType_radio_hsmType
  unsupported: true
  note: builder prices KMS and CSMS on-demand usage
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_hsmType_radio_Stepper_0
  option: periods
