  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_ga_stepper_main_DestinationEndpoint
  kind: base-select
  title: Region
  value_type: Filter
  option_key: DestinationEndpoint
  values: catalog
  after:
  - calculator_ga_stepper_main_SourceEndpoint
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_ga_stepper_main_Stepper_0
  kind: base-stepper
