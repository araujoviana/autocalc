service: eip
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: not in the recipe; the page default is kept
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_eip_radio_type_shareType
  kind: base-radio-group
  title: Product Type
  value_type: Filter
  option_key: shareType
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_eip_radio_type_eipSpec
  kind: base-radio-group
  title: Routing Type
  value_type: Filter
  option_key: eipSpec
  values: catalog
  after:
  - calculator_eip_radio_type_shareType
  unsupported: true
  note: not in the recipe; the page default is kept
- id: calculator_eip_radio_eipType
  kind: base-radio-group
  title: Billed By
  value_type: Filter
  option_key: eipType
  values: catalog
  after:
  - calculator_eip_radio_type_eipSpec
  option: billed_by
- id: calculator_eip_radio_Stepper_0
  kind: base-stepper
  title: Bandwidth
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 2000.0
    default: 1.0
    when: ^19_(s?|(youxuan)?)bgp(-.*-los1a)?$
  - min: 5.0
    max: 2000.0
    default: 5.0
    when: ^19_share$
  - min: 1.0
    max: 99.0
    default: 1.0
    unit: calc_29_
    when: ^19_share$
  - min: 1.0
    max: 9999.0
    default: 1.0
    when: ^12_(s?|(youxuan)?)bgp(-.*-los1a)?$
  - min: 1.0
    max: 9999.0
    default: 1.0
    when: ^12_(s?|(youxuan)?)bgp(-.*-los1a)?$
  - min: 300.0
    max: 2000.0
    default: 300.0
  after:
  - calculator_eip_radio_eipType
  option: bandwidth_mbps
- id: calculator_ipQuantity_stepper_Stepper_0
  kind: base-stepper
  title: EIP Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 99.0
    default: 1.0
    unit: ' '
  after:
  - calculator_eip_radio_Stepper_0
  option: ip_quantity
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_ipQuantity_stepper_Stepper_0
  option: periods
- id: calculator_eip_radio_Stepper_3
  kind: base-stepper
  title: Traffic
  value_type: Stepper_Resource
  option_key: UNSET_Stepper_3
  values: catalog
  ranges:
  - min: 1.0
    max: 2000.0
    default: 1.0
    when: ^19_(s?|(youxuan)?)bgp(-.*-los1a)?$
  after:
  - calculator_eip_radio_eipType
  option: traffic_gb
