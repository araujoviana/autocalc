service: obs
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_productType_switch_productType
  kind: base-radio-group
  title: Product Type
  value_type: Filter
  option_key: productType
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  unsupported: true
  note: fixed to object storage by the builder
- id: calculator_Pack_checkboxGroup_packageType
  kind: base-checkbox-group
  title: Package Type
  value_type: Filter
  option_key: packageType
  values: catalog
  after:
  - calculator_productType_switch_productType
  option: package
- id: calculator_storagePack_radio_obsStorageSize
  kind: base-radio-group
  title: Storage Space
  value_type: Filter
  option_key: obsStorageSize
  default: calc_33_
  values: catalog
  after:
  - calculator_Pack_checkboxGroup_packageType
  option: package
- id: calculator_Outbound_radio_obsDownTrafficSize
  kind: base-radio-group
  title: Internet Outbound Traffic
  value_type: Filter
  option_key: obsDownTrafficSize
  values: catalog
  after:
  - calculator_storagePack_radio_obsStorageSize
  option: traffic_package
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_Outbound_radio_obsDownTrafficSize
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 99.0
    default: 1.0
    unit: PCS
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
