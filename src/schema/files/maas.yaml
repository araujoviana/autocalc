- id: calculator_token_cached_input_stepper_Stepper_0
  kind: base-stepper
  title: Cache Hit Input
  value_type: Stepper_Usage
  option_key: UNSET_Stepper_0
  values: catalog
  ranges:
  - min: 1.0
    max: 999999999.0
    default: 1.0
    unit: million tokens
  after:
  - calculator_output_stepper_Stepper_0
  option: cached_input_mtokens
