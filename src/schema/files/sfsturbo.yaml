service: sfsturbo
frontend: 11.4.201
controls:
- id: global_REGIONINFO_region
  kind: base-region
  title: Region
  value_type: Filter
  option_key: region
  default: ap-southeast-1
  values: catalog
  option: region
- id: global_REGIONINFO_locationType
  kind: base-radio-group
  title: AZ
  value_type: Filter
  option_key: locationType
  values: catalog
  after:
  - global_REGIONINFO_region
  unsupported: true
  note: AZ is left at the page default
- id: global_REGIONINFO_chargeMode
  kind: base-radio-group
  title: Billing Mode
  value_type: Filter
  option_key: chargeMode
  values: catalog
  after:
  - global_REGIONINFO_locationType
  option: billing
- id: calculator_sfsType_radio_fileType
  kind: base-radio-group
  title: File System Type
  value_type: Filter
  option_key: fileType
  values: catalog
  after:
  - global_REGIONINFO_chargeMode
  option: tier
- id: calculator_sfsType_radio_sellingStatus
  kind: base-radio-group
  value_type: Filter
  option_key: sellingStatus
  default: calc_7_
  values: catalog
  after:
  - calculator_sfsType_radio_fileType
  option: tier
- id: calculator_sfsType_radio_sfsType
  kind: base-radio-group
  title: Type
  value_type: Filter
  option_key: sfsType
  values: catalog
  after:
  - calculator_sfsType_radio_sellingStatus
  option: tier
- id: calculator_sfsPeriod_36input
  kind: common-input
  title: detail_31_
  default: 3.6
  after:
  - calculator_sfsType_radio_sfsType
  option: size_gb
- id: global_PERIODTIME_UNSET_PeriodTime
  kind: base-radio-group
  title: Required Duration
  value_type: Filter
  option_key: UNSET_PeriodTime
  values: catalog
  after:
  - calculator_sfsPeriod_36input
  option: periods
- id: global_QUANTITY_Stepper_0
  kind: base-stepper
  title: Quantity
  value_type: Stepper_ProductNum
  option_key: UNSET_Stepper_0
  ranges:
  - min: 1.0
    max: 10000.0
    default: 1.0
    unit: PCS
  after:
  - global_PERIODTIME_UNSET_PeriodTime
  option: quantity
