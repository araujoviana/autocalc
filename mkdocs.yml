site_name: autocalc
site_description: Verified share links from cloud pricing calculators, for AI agents and the people who use them.
docs_dir: docs
strict: true
exclude_docs: |
  /quotes.md
  /handoff.md
  /compat/
  /reports/
  /private/
  /research/
  /superpowers/
  /design/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

plugins:
  - search

nav:
